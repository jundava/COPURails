        { id: 103, nro_recibo: 'REC-2026-0014', fecha_hora: '15/10/2026 11:05', descripcion: 'Solidaridad Octubre', referencia: 'SOCIO: 12544', forma_pago: 'QR_BANCARIO', monto: 30000, cajero: 'USR_994' }

      // Añadir esto debajo de historialCobranzasFiltrado
      const totalHistorialFiltrado = Vue.computed(() => {
        return historialCobranzasFiltrado.value.reduce((acc, recibo) => {
          return acc + recibo.monto;
        }, 0);
      });

      // 4. Métodos
      const cambiarVista = (vista) => {

      // 1. Declarar el formateador UNA SOLA VEZ (Evita la ralentización del navegador)

      const formatCurrency = (value) => {
        // 2. Proteger contra valores indefinidos para que Vue no colapse
        if (value === null || value === undefined || isNaN(value)) return '0';
        return formateadorMoneda.format(value);
      };
      // Comunicación con GAS
      const solicitarApertura = () => {
        loading.value = true;
        const payload = {
          tenantId: tenant.id,
          sucursalId: tenant.sucursal,
          userId: tenant.user,
          montoInicial: caja.montoIngreso

        // Llamada Asíncrona al Backend .gs
        google.script.run
          .withSuccessHandler((response) => {
             loading.value = false;

      // --- ESTADO: APROBACIONES DE SOCIOS ---

      });

      // Propiedad Computada: Solo mostramos los expedientes que ya pasaron por Mesa de Entrada
      const expedientesParaEvaluar = Vue.computed(() => {
        return listaSolicitudes.value.filter(sol => {
          const enEvaluacion = sol.estado === 'EN_EVALUACION'; // Ya recepcionado
          const coincideFiltro = sol.nombre_completo.toLowerCase().includes(aprobaciones.filtro.toLowerCase()) || sol.nro_documento.includes(aprobaciones.filtro);

      // --- MÉTODOS: APROBACIONES ---
      const abrirModalAprobacion = (expediente) => {

          s.nombre_completo.toLowerCase().includes(query) || 
          s.ci.includes(query) ||

      // --- MÉTODOS: PADRÓN ---
      const seleccionarSocio = (socio) => {
        padron.socioSeleccionado = socio;
        padron.tabActivo = 'personales'; // Reset a la primera pestaña
      };
      // --- ESTADO: GRUPO FAMILIAR ---

        busquedaSocio: '',

        mostrarModal: false

      const formularioPariente = reactive({
        id: null,
        documento: '',
        nombre: '',
        relacion: 'HIJO/A',
        nacimiento: '',

        { id: 101, socio_nro: '12544', documento: '4.294.168', nombre: 'PEREZ, MARCOS', relacion: 'HIJO/A', nacimiento: '15/06/2005' },
        { id: 102, socio_nro: '12544', documento: '3.100.540', nombre: 'LOPEZ DE PEREZ, MARTA', relacion: 'CÓNYUGE', nacimiento: '20/08/1982' }

      // Propiedad Computada: Solo trae los parientes del socio activo
      const parientesDelSocio = Vue.computed(() => {
        if (!grupoFamiliar.socioActivo) return [];
        return baseParientes.value.filter(p => p.socio_nro === grupoFamiliar.socioActivo.nro_socio);
      });

      // --- MÉTODOS: GRUPO FAMILIAR ---
      const buscarSocioParaFamilia = () => {
        const query = grupoFamiliar.busquedaSocio.trim();
        if (!query) return;

        // Lógica de búsqueda simulada (En producción llama a google.script.run)
        const socioEncontrado = baseSociosActivos.value.find(s => s.nro_socio === query || s.ci === query);
        
        if (socioEncontrado) {
          grupoFamiliar.socioActivo = socioEncontrado;
        } else {
          alert("No se encontró ningún socio activo con ese identificador.");

      const abrirModalPariente = () => {
        formularioPariente.id = null;
        formularioPariente.documento = '';
        formularioPariente.nombre = '';
        formularioPariente.relacion = 'HIJO/A';
        formularioPariente.nacimiento = '';
        formularioPariente.sexo = 'MASCULINO';
        grupoFamiliar.mostrarModal = true;
      };

      const cerrarModalPariente = () => {
        grupoFamiliar.mostrarModal = false;
      };

      const guardarPariente = () => {
        // Insertar en la base de datos local simulada
        baseParientes.value.push({
          id: Date.now(),

          relacion: formularioPariente.relacion,
          // Convertimos la fecha del input YYYY-MM-DD al formato local DD/MM/YYYY
          nacimiento: formularioPariente.nacimiento.split('-').reverse().join('/') 
        });
        
        cerrarModalPariente();
        alert("Pariente registrado exitosamente."); // Reemplazar por Toast UI
      };

      const eliminarPariente = (id) => {
        if (confirm("¿Está seguro de eliminar este registro del grupo familiar?")) {
          baseParientes.value = baseParientes.value.filter(p => p.id !== id);
        }
      };
      // --- ESTADO Y MÉTODOS: MOVIMIENTOS Y BAJAS ---
      const movimientos = reactive({
        busquedaSocio: '',
        socioActivo: null,
        mostrarModal: false
      });

      const formEvento = reactive({
        tipo: 'CARGO_DIRECTIVO',
        titulo: '',
        fechaInicio: '',
        fechaFin: '',
        detalle: ''
      });

      // Mock Data Timeline
      const baseEventos = ref([
        { id: 1, socio_nro: '12544', tipo: 'CARGO_DIRECTIVO', titulo: 'PRO-TESORERO', fecha_registro: '15/10/2026', descripcion_corta: 'Mandato 2026-2028', detalle: 'Aprobado mediante Asamblea Ordinaria.' }
      ]);

      const historialEventosSocio = Vue.computed(() => {
        if(!movimientos.socioActivo) return [];
        return baseEventos.value.filter(e => e.socio_nro === movimientos.socioActivo.nro_socio);

      const buscarSocioParaMovimiento = () => {

      const abrirModalMovimiento = () => {

        movimientos.mostrarModal = true;
      };

      const guardarEvento = () => {
        baseEventos.value.unshift({
          id: Date.now(),
          socio_nro: movimientos.socioActivo.nro_socio,

      // --- BAJAS Y RENUNCIAS ---
      const bajas = reactive({
        busquedaSocio: '',
        socioActivo: null
      });

      const deudaValidacion = reactive({
        conDeuda: false,
        saldoPrestamos: 0,
        saldoSolidaridad: 0,
        aportesIntegrados: 0
      });

      const formBaja = reactive({
        motivo: 'RENUNCIA_VOLUNTARIA',
        acta: '',
        observacion: ''
      });

      const buscarSocioParaBaja = () => {
        const query = bajas.busquedaSocio.trim();
        const socioEncontrado = baseSociosActivos.value.find(s => s.nro_socio === query || s.ci === query);
        
        if (socioEncontrado) {
          bajas.socioActivo = socioEncontrado;
          // Simulación del motor "Fase 1: Verificación de Obligaciones"
          // En producción: google.script.run.verificarDeudaSocio(socioEncontrado.nro_socio)
          if(query === '12544') { 
              deudaValidacion.conDeuda = true;
              deudaValidacion.saldoPrestamos = 12500000; // Tiene deuda activa! No puede salir.
              deudaValidacion.aportesIntegrados = 3500000;
          } else {
              deudaValidacion.conDeuda = false;
              deudaValidacion.saldoPrestamos = 0;
              deudaValidacion.aportesIntegrados = 850000;
          }
        } else {
          alert("No se encontró al socio en el Padrón.");

      const ejecutarBaja = () => {
        if(confirm(`¿Está seguro de ejecutar la baja definitiva de ${bajas.socioActivo.nombre_completo}? Esta acción liquidará los aportes y revocará su acceso.`)) {

          bajas.socioActivo = null; // Reiniciar pantalla
        }

      // --- ESTADO: SOLICITUD DE CRÉDITO ---
      const credito = reactive({
        busquedaSocio: '',
        socioActivo: null
      });

      const formCredito = reactive({
        linea: 'ORDINARIO',
        destino: 'CONSUMO',
        monto: 5000000,
        plazo: 12,
        tasa: 18.5, // % Anual (Parametrizada)
        garantia: 'SOLA_FIRMA',
        codeudorId: ''
      });

      // Variables para la Proyección Matemática
      const proformaGenerada = ref(false);
      const cuotaCalculada = ref(0);
      const totalInteresCalculado = ref(0);
      const tablaAmortizacion = ref([]);

      // --- MÉTODOS: SOLICITUD DE CRÉDITO ---
      const buscarSocioParaCredito = () => {
        const query = credito.busquedaSocio.trim();
        const socioEncontrado = baseSociosActivos.value.find(s => s.nro_socio === query || s.ci === query);
        
        if (socioEncontrado) {
          credito.socioActivo = socioEncontrado;
          proformaGenerada.value = false;
        } else {
          alert("No se encontró al socio.");
        }
      };

      const limpiarCredito = () => {
        credito.socioActivo = null;
        proformaGenerada.value = false;
        formCredito.monto = 5000000;
      };

      // Algoritmo de Amortización Sistema Francés
      const calcularProforma = () => {
        if (formCredito.monto <= 0 || formCredito.plazo <= 0) return;

        const tasaMensual = (formCredito.tasa / 100) / 12;
        const n = formCredito.plazo;
        const prestamo = formCredito.monto;

        // Fórmula Cuota Sistema Francés: C = P * [i(1+i)^n] / [(1+i)^n - 1]
        const cuota = prestamo * (tasaMensual * Math.pow(1 + tasaMensual, n)) / (Math.pow(1 + tasaMensual, n) - 1);
        cuotaCalculada.value = Math.round(cuota); // Redondeo moneda Guaraní

        // Generar Tabla
        tablaAmortizacion.value = [];
        let saldoRestante = prestamo;
        let sumaInteres = 0;

        for (let i = 1; i <= n; i++) {
          let interesMes = saldoRestante * tasaMensual;
          let amortizacionCapital = cuota - interesMes;
          
          saldoRestante -= amortizacionCapital;
          sumaInteres += interesMes;

          tablaAmortizacion.value.push({
              numero: i,
              capital: Math.round(amortizacionCapital),
              interes: Math.round(interesMes),
              saldo: Math.max(0, Math.round(saldoRestante))
          });
        }

        totalInteresCalculado.value = Math.round(sumaInteres);
        proformaGenerada.value = true;
      };

      // --- ESTADO: MAESTRO DE PRÉSTAMOS ---
      const maestro = reactive({
        busqueda: '',
        prestamoActivo: null,
        cuotasDelPrestamo: []
      });

      // Simulación Base de Datos de Préstamos Activos
      const bdMaestroPrestamos = ref([
        {
          id: 1,
          nro_prestamo: 'PR-2026-0901',
          socio_id: '12544',
          nombre_socio: 'PEREZ PEREZ, JUAN ANIBAL',
          ci: '1.254.333',
          tipo_linea: 'ORDINARIO',
          fecha_desembolso: '01/05/2026',
          monto_aprobado: 5000000,
          saldo_capital: 3500000,
          total_interes: 625000,
          tasa: 15,
          plazo_meses: 12,
          situacion: 'VIGENTE',
          calificacion: '1 (Normal)'
        }
      ]);

      // Simulación de Tabla de Amortización (Cuotas Reales) del Préstamo 1
      const bdCuotasReales = ref([
        { prestamo_id: 1, nro_cuota: 1, vencimiento: '05/06/2026', capital: 388000, interes: 62500, total: 450500, estado: 'PAGADA' },
        { prestamo_id: 1, nro_cuota: 2, vencimiento: '05/07/2026', capital: 393000, interes: 57500, total: 450500, estado: 'PAGADA' },
        { prestamo_id: 1, nro_cuota: 3, vencimiento: '05/08/2026', capital: 398000, interes: 52500, total: 450500, estado: 'PAGADA' },
        { prestamo_id: 1, nro_cuota: 4, vencimiento: '05/09/2026', capital: 403000, interes: 47500, total: 450500, estado: 'PAGADA' },
        { prestamo_id: 1, nro_cuota: 5, vencimiento: '05/10/2026', capital: 408000, interes: 42500, total: 450500, estado: 'PENDIENTE' }, // Cuota Vencida
